<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Studio - Orchestration IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #8b5cf6;
      --danger: #ef4444;
      --success: #10b981;
      --dark-bg: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
    }
    body {
      background: linear-gradient(135deg, var(--dark-bg) 0%, #0f172a 100%);
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .sidebar {
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      overflow-y: auto;
    }
    .main-content {
      margin-left: 280px;
      padding: 2rem;
    }
    .nav-link {
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      margin: 0.25rem 0;
      transition: all 0.2s;
    }
    .nav-link:hover, .nav-link.active {
      background: var(--primary);
      color: white;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .stat-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="p-3">
      <h3 class="text-white mb-4">🤖 Agent Studio</h3>
      <div class="avatar mb-3">US</div>
      <p class="text-muted small">User Dashboard</p>
    </div>
    
    <nav class="nav flex-column p-2">
      <a href="#/" class="nav-link active" onclick="showPage('dashboard')"><span>📊</span>Dashboard</a>
      <a href="#/" class="nav-link" onclick="showPage('agents')"><span>🤖</span>Mes Agents</a>
      <a href="#/" class="nav-link" onclick="showPage('memory')"><span>🧠</span>Mémoire</a>
      <a href="#/" class="nav-link" onclick="showPage('connections')"><span>🔗</span>Connections</a>
      <a href="#/" class="nav-link" onclick="showPage('workflows')"><span>⚡</span>Workflows</a>
      <a href="#/" class="nav-link" onclick="showPage('shared')"><span>🌐</span>Commun</a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div id="page-content">
      <!-- Dashboard Page -->
      <div id="dashboard-page" style="display: block;">
        <h2 class="mb-4">Dashboard</h2>
        
        <!-- Stats Cards -->
        <div class="row mb-4">
          <div class="col-md-4">
            <div class="card stat-card p-4">
              <h6 class="mb-2 opacity-75">Agents Actifs</h6>
              <h3 class="mb-0" id="agent-count">0</h3>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card stat-card p-4">
              <h6 class="mb-2 opacity-75">Tâches Aujourd'hui</h6>
              <h3 class="mb-0" id="task-count">0</h3>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card stat-card p-4">
              <h6 class="mb-2 opacity-75">Budget</h6>
              <h3 class="mb-0" id="budget">$0.00</h3>
            </div>
          </div>
        </div>

        <!-- Agents List -->
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Mes Agents</h5>
            <button class="btn btn-outline-primary btn-sm" onclick="createAgent()">+ Nouvel Agent</button>
          </div>
          <div class="card-body" id="agents-list">
            <div class="text-center py-4">Chargement...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Page navigation
    function showPage(page) {
      document.querySelectorAll('[id$="-page"]').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
      event.target.classList.add('active');
      
      const pageEl = document.getElementById(page + '-page');
      if (pageEl) pageEl.style.display = 'block';
    }

    // Load agents
    async function loadAgents() {
      try {
        const response = await fetch('/api/agents', {
          headers: {'Authorization': 'Bearer ***'}
        });
        const agents = await response.json();
        
        const listEl = document.getElementById('agents-list');
        listEl.innerHTML = agents.length === 0 
          ? '<div class="text-center py-4 text-muted">Aucun agent</div>'
          : agents.map(a => `
            <div class="card mb-2">
              <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                  <strong>${a.name}</strong>
                  <br><small class="text-muted">${a.type}</small>
                </div>
                <span class="badge ${a.status === 'active' ? 'bg-success' : 'bg-secondary'}">${a.status}</span>
              </div>
            </div>
          `).join('');
      } catch (e) {
        document.getElementById('agents-list').innerHTML = 
          '<div class="text-center py-4 text-danger">Erreur de chargement</div>';
      }
    }

    // Create agent
    async function createAgent() {
      const name = prompt('Nom de l\'agent:');
      if (!name) return;
      
      try {
        const response = await fetch('/api/agents', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ***'
          },
          body: JSON.stringify({ name, type: 'custom' })
        });
        
        if (response.ok) {
          loadAgents();
          alert('Agent créé avec succès!');
        }
      } catch (e) {
        alert('Erreur création agent');
      }
    }

    // Init
    loadAgents();
  </script>
</body>
</html>
